# =========src ctrl=========

[git_branch]
symbol = "git" #              |
style = "fg:fg_1 bg:bg_1"
format = '[| $symbol $branch ]($style)'

[git_status]
style = "fg:fg_1 bg:bg_1"
format = '[| $all_status$ahead_behind ]($style)'#"[ $ahead$behind$untracked$modified$staged$deleted ]($style)"
conflicted = 'Cnf= $count'
ahead = "Ahd $count "
behind = "Beh $count "
deleted = "Del $count " #
diverged = "Div $count " #
renamed = "Ren $count "
stashed = "Sta $count "
modified = "Mod $count " #  
staged = "Stg $count "
untracked = "UnT $count " # 🤷󰙌
up_to_date = 'Ok'

[git_commit]
disabled=true
only_detached=false
tag_disabled=false
tag_symbol = 'T '
# tag_max_candidates=1
style = "fg:fg_1 bg:bg_1"
format = "[| $symbol$hash$tag ]($style)"
commit_hash_length = 4

[git_state]
disabled=false
style = "fg:fg_1 bg:bg_1"
format = '| \([$state( $progress_current/$progress_total)]($style)\) '
cherry_pick = '[PICKING]'
rebase = '[REBASING]'
merge = '[MERGING]'
bisect = '[BISECTING]'
am = '[AM]'
am_or_rebase = '[AM/REBASE]'
revert = '[REVERTING]'
#progress_divider = ' of '

[git_metrics]
added_style = "fg:fg_1 bg:bg_1"
deleted_style = "fg:fg_1 bg:bg_1"
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'
disabled = false

[fossil_branch]
symbol = 'fos ' #󰘬
style = "fg:fg_1 bg:bg_1"
format = '[[ $symbol $branch ](fg:fg_1 bg:bg_1)]($style)'

[fossil_metrics]
added_style = "fg:fg_1 bg:bg_1"
deleted_style = "fg:fg_1 bg:bg_1"
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'

[hg_branch]
symbol = "hg "
style = "fg:fg_1 bg:bg_1"
format = '[[ $symbol $branch ](fg:fg_1 bg:bg_1)]($style)'

[hg_state]
