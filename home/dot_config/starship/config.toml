[pixi]
symbol = "pix" # 󰰚
style = "fg:fg_1 bg:bg_1"
format = '[| $symbol $context $path ]($style)'

[singularity]
symbol = "sin"
disabled = false
style = "fg:fg_1 bg:bg_1"
format = '[| $symbol $context $namespace ]($style) ' #AppTainer

# ========time/shell/shlvl/jobs/memory_usage==========

[time]
disabled = false
time_format = "%R" # Hour:Minute Format # %T for seconds
style = "fg:fg_1 bg:bg_1"
format = '[| $time ]($style)'

[shlvl]
disabled=false
symbol="l"
style = "fg:fg_1 bg:bg_1"
format = '[| $symbol$shlvl ]($style)'

[jobs]
disabled = false
symbol = 'j'
number_threshold = 1
symbol_threshold = 1
style = "fg:fg_1 bg:bg_1"
format="[| $symbol$number ]($style)"

[shell]
disabled=false
bash_indicator = 'b'
cmd_indicator = 'c ' #
elvish_indicator = "e"
fish_indicator='f' #🐟
ion_indicator = 'i'
nu_indicator = "n"
powershell_indicator = 'p' # 
tcsh_indicator = "t"
xonsh_indicator = "x "  #"🐚" # seashell emoji
zsh_indicator = "z"
unknown_indicator = ' '
style = "fg:fg_1 bg:bg_1"
format="[| $indicator ]($style)" #space on right b/c double-width symbol

[memory_usage]
disabled=true
symbol = " "
style = "fg:fg_1 bg:bg_1"
format = '[ $symbol ]($style)'
