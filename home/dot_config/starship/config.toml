# ==========duration========

[cmd_duration] #    
format='[| $duration ]($style)'
style='fg:fg_1 bg:bg_1'

# =========files=========

# inspired by @lolbat on CodeBerg
[custom.files]
description = "Show files count for current directory"
command = "find ./ -maxdepth 1 -type f | wc -l"
format = "[| F $output ]($style)"
style = "fg:fg_1 bg:bg_1"
when = "false"

# =========directories=========

[custom.directories]
description = "Show directory count count for current directory"
command = "find ./ -maxdepth 1 -type d | tail -n +2 | wc -l"
format = "[| D $output ]($style)"
style = "fg:fg_1 bg:bg_1"
when = "false"

# ==========battery========

[battery]
full_symbol = "bat "
charging_symbol = "Chg "
discharging_symbol = "DCh "
empty_symbol = 'Emp '
format = "[| $symbol$percentage ]($style)"
disabled = false

# [[battery.display]]
# threshold = 25
# style = "bold fg:fg_red2 bg:bg_1"

# [[battery.display]]
# threshold = 50
# style = "bold fg:orange bg:bg_1"

# [[battery.display]]
# threshold = 75
# style = "bold fg:yellow bg:bg_1"

[[battery.display]]
threshold = 100
style = "fg:fg_1 bg:bg_1"
# style = "bold fg:green bg:bg_1"

# ==========status========

[character]
success_symbol = "[Ok](fg:success_fg bg:bg_1)" #✅
error_symbol = "[X](fg:error_fg bg:bg_1)" #⛔
format = "[| $symbol ](fg:fg_1 bg:bg_1)"

[status]
disabled = false
format = '[$status:$common_meaning ](fg:error_fg bg:bg_1)'

[sudo]
symbol = "Su" #
style = "fg:fg_1 bg:bg_1"
format = "[| $symbol ]($style)"
disabled = false

# =========line break=========

[line_break]
disabled = true

# =========user/host=========

[env_var.STY]
#variable = 'STY'
style = "fg:fg_1 bg:bg_1"
format = "[| sty $env_value ]($style)"
# default=""
# disabled = true

[username] #          
show_always = true
style_user = "fg:fg_1 bg:bg_1"
style_root = "fg:fg_1 bold bg:bg_1"
format = '[| ($user) ]($style)'

[hostname]
ssh_only = true
style = "fg:fg_1 bg:bg_1"
format = "[ ss $hostname ]($style)" # ><
trim_at = "."
# disabled = true

[localip]
ssh_only = true
style = "fg:fg_1 bg:bg_1"
format = '[ $localipv4]($style)' #@
disabled = false

# ========directory==========

[directory]
style = "fg:fg_1 bg:bg_1"
format = "[| $read_only$path ]($style)"
read_only = 'R ' #🔒
#read_only_style   = ''
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
home_symbol="Hom" #🏠
use_os_path_sep = true

[direnv]
style = "fg:fg_1 bg:bg_1"
format="[| $symbol $loaded/$allowed ]($style)"
symbol="Denv "
# detect_files=['.envrc']
# detect_folders=[]
# detect_env_vars=['TESTDIRENV']
allowed_msg="Alw "
not_allowed_msg="NAl "
denied_msg="Den "
loaded_msg="Ld "
unloaded_msg="UnL "
disabled=false

