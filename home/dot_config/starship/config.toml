# ~/.config/starship.toml
#
# Run in zsh to see palette of available colors:
# for i in {0..255}; do print -Pn "%K{$i} %k%F{$i}${(l:3::0:)i}%f " ${${(M)$((i%6)):#3}:+$'\n'}; done

# Refresh
#eval "$(starship init bash)"
#
# |   ~   󰈙      🔑     
# fade_left: = |      
# fade_right: = |      
# end_left: = | 
# end_right: = | 
#
# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Disable the blank line at the start of the prompt
add_newline = true

# =========prompt=========
# [| ](fg:fg_1 bg:bg_1)\
# [| ](fg:fg_1 bg:bg_1)\

format = """
$os\
$cmd_duration\
${custom.files}\
${custom.directories}\
$battery\
$character\
$status\
$sudo\
$line_break\
$env_var\
$username\
$hostname\
$localip\
$directory\
$direnv\
$git_branch\
$git_status\
$git_commit\
$git_state\
$git_metrics\
$fossil_branch\
$fossil_metrics\
$hg_branch\
$hg_state\
$pijul_channel\
$vcs\
$vcsh\
$buf\
$bun\
$c\
$cmake\
$cobol\
$conda\
$crystal\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haxe\
$helm\
$haskell\
$java\
$julia\
$kotlin\
$lua\
$maven\
$meson\
$mise\
$mojo\
$nats\
$nim\
$nix_shell\
$nodejs\
$ocaml\
$odin\
$opa\
$package\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$red\
$rlang\
$ruby\
$scala\
$rust\
$spack\
$swift\
$terraform\
$typst\
$vagrant\
$vlang\
$xmake\
$zig\
$aws\
$azure\
$container\
$docker_context\
$gcloud\
$guix_shell\
$kubernetes\
$netns\
$openstack\
$pixi\
$singularity\
$time\
$shlvl\
$jobs\
$shell\
"""

#${custom.files}${custom.directories}\

# A continuation prompt that displays right half-circle and filled-in arrow
continuation_prompt = "[$shell ](fg:fg_1 bg:bg_1)"

#the continuation prompt may not be shown if the right prompt is used; RP only appears in fish/zsh/xonsh, not bash/pwsh/tcsh/ion
# right_format = """
# [| ](fg:bg_1)\
# [| ](fg:bg_1 bg:bg_1)\
# [| ](fg:bg_1 bg:bg_1)\
# [test](fg:fg_1 bg:bg_1)\
# [|](fg:bg_1)\
# """

follow_symlinks = false

# =========palettes=========
#conspy behavior in comments
palette = 'lightgreen2' #dk purple BG steady lt yellow FG
# palette = 'lightblue2' #dk cyan BG steady lt yellow FG
# palette = 'lightcyan2' #lt gray BG steady lt yellow FG
# palette = 'dark' #dk blue BG steady lt yellow FG
# palette = 'darkgreen' #dk blue BG steady dk red FG
